services:
  obsidian-sync:
    build: .
    container_name: obsidian-headless-sync
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      - HOME=/home/node
    volumes:
      - ./config:/home/node/.config
      - ./vault:/home/node/vault

  obsidian-mcp:
    build: .
    container_name: obsidian-mcp-server
    restart: unless-stopped
    user: "${UID}:${GID}"
    # --stateful + --sessionTimeout: without these, supergateway's default
    # stateless stdio->StreamableHttp mode spawns a fresh `mcpvault` child
    # process per request and never reaps it (no session object exists to
    # attach a timeout to). Over days that leaked hundreds of MB of RAM into
    # orphaned node processes and eventually forced a full Pi reboot.
    # --stateful reuses one child per session; --sessionTimeout kills an
    # idle session (and its child process) after 10 minutes of inactivity.
    entrypoint: [
      "supergateway",
      "--port", "3000",
      "--outputTransport", "streamableHttp",
      "--stateful",
      "--sessionTimeout", "600000",
      "--stdio", "npx -y @bitbonsai/mcpvault@latest /data/vault"
    ]
    environment:
      - OBSIDIAN_API_KEY=${OBSIDIAN_API_KEY}
      # UID:GID below has no /etc/passwd entry in this image, so HOME
      # defaults to "/" and npm's `npx -y @bitbonsai/mcpvault` (spawned
      # per session by supergateway) fails EACCES trying to mkdir
      # /.npm on the root-owned filesystem — every session's child dies
      # before it can answer `initialize`, which reads from the MCP
      # client as a connection timeout. /tmp is world-writable (1777)
      # regardless of UID, so pointing HOME there gives npm somewhere
      # it can actually create a cache.
      - HOME=/tmp
    volumes:
      - ./vault:/data/vault
    ports:
      - "3000:3000"
    # Defense in depth: even if a future leak slips past --stateful, cap
    # this container's memory so Docker restarts it long before it can
    # swap the whole Pi into a stall.
    mem_limit: 768m
